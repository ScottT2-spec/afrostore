name: Generate Prisma baseline migration

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (no scripts, to avoid needing a DB)
        run: npm ci --ignore-scripts

      - name: Generate baseline SQL from current schema
        run: |
          set +e
          npx prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script > prisma/migrations/0_init/migration.sql 2> err.log
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(tail -c 900 err.log | tr '\n' ' ')
            echo "::error::PRISMA_DIFF_FAILED: $msg"
            exit $code
          fi

      - name: Commit and push generated migration
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/0_init/migration.sql
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Generate Prisma baseline migration SQL (automated)"
          git push 2> push_err.log
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(tail -c 900 push_err.log | tr '\n' ' ')
            echo "::error::GIT_PUSH_FAILED: $msg"
            exit $code
          fi
