name: Generate Prisma baseline migration

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (no scripts, to avoid needing a DB)
        run: npm ci --ignore-scripts

      - name: Generate baseline SQL from current schema
        run: |
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prisma/migrations/0_init/migration.sql

      - name: Commit and push generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/0_init/migration.sql
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Generate Prisma baseline migration SQL (automated)"
          git push
