version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Load every variable from .env instead of a hand-picked subset — the
    # previous list only forwarded 5 of the ~34 vars in .env.example, so
    # everything else (Paystack, AI providers, Supabase storage, AWS SES,
    # PROFILE_ENCRYPTION_KEY, CRON_SECRET...) never reached the container
    # no matter what was set in .env on the host.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Lets the domain-verify route write a new domain's nginx config the
      # moment DNS checks out — see docker/certbot-provision.sh for what
      # picks it up from here (cert issuance + upgrading to the SSL block).
      - NGINX_DOMAINS_DIR=/etc/nginx/conf.d/domains
    volumes:
      - ./nginx/domains:/etc/nginx/conf.d/domains
    networks:
      - prokip

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/domains:/etc/nginx/conf.d/domains:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - app
    # Self-reload every 30s: nginx only reads config files at startup or on
    # an explicit reload signal. New/changed domain configs land in
    # ./nginx/domains from the app (new domain) and certbot (SSL upgrade)
    # containers, neither of which can reach into this one to trigger a
    # reload directly — polling is the simplest reliable way to pick those
    # up without wiring cross-container exec/signals. `nginx -s reload` is
    # graceful: no dropped connections, workers finish in-flight requests.
    command: >
      sh -c "nginx -g 'daemon off;' &
             while :; do sleep 30; nginx -s reload 2>/dev/null; done"
    networks:
      - prokip

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    environment:
      - NGINX_DOMAINS_DIR=/etc/nginx/conf.d/domains
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-admin@prokip.africa}
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./nginx/domains:/etc/nginx/conf.d/domains
      - ./docker/certbot-provision.sh:/usr/local/bin/certbot-provision.sh:ro
    entrypoint: "/bin/sh /usr/local/bin/certbot-provision.sh"
    networks:
      - prokip

  # Replaces vercel.json's Crons, which do nothing outside Vercel. Runs
  # inside the same Docker network as `app`, so it calls it directly by
  # service name instead of needing a public URL. Requires CRON_SECRET to
  # be set in .env (the app rejects an unauthenticated call to these two
  # routes if CRON_SECRET is set but not provided).
  cron:
    image: alpine:3.20
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - app
    volumes:
      - ./docker/crontab:/etc/crontabs/root:ro
    # Dump the container's env to a file each job can source before
    # running — BusyBox crond's environment inheritance for spawned jobs
    # isn't reliable enough to depend on for something CRON_SECRET-gated,
    # so each line in ./docker/crontab explicitly sources this first.
    command: sh -c "apk add --no-cache curl >/dev/null && env > /etc/container.env && crond -f -l 2"
    networks:
      - prokip

volumes:
  certbot-conf:
  certbot-www:

networks:
  prokip:
    driver: bridge
